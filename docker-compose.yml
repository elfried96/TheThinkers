version: '3.8'

services:
  # Backend ANDFChat - Système de RAG
  andfchat-backend:
    build: 
      context: ./ANDFChat
      dockerfile: Dockerfile
    container_name: andfchat-backend
    ports:
      - "8001:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PORT=8000
      - ENVIRONMENT=development
    volumes:
      - ./ANDFChat/data:/home/app/data
      - ./ANDFChat/logs:/home/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - hackia-network

  # API Extraction Coordonnées  
  ia-coordinates-api:
    build:
      context: ./IA
      dockerfile: Dockerfile
    container_name: ia-coordinates-api
    ports:
      - "8002:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PORT=8000
      - ENVIRONMENT=development
    volumes:
      - ./IA/temp:/home/app/temp
      - ./IA/logs:/home/app/logs
      # Volume pour les données géospatiales (si présentes)
      - ./IA/Data_Hackathon_IA_2025:/home/app/Data_Hackathon_IA_2025:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - hackia-network

  # Nginx Reverse Proxy (optionnel pour production)
  nginx:
    image: nginx:alpine
    container_name: hackia-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - andfchat-backend
      - ia-coordinates-api
    restart: unless-stopped
    networks:
      - hackia-network
    profiles:
      - production

networks:
  hackia-network:
    driver: bridge
    name: hackia-network

volumes:
  andfchat-data:
    driver: local
  ia-temp:
    driver: local