events {
    worker_connections 1024;
}

http {
    upstream andfchat {
        server andfchat-backend:8000;
    }

    upstream ia-api {
        server ia-coordinates-api:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Augmenter les limites pour upload d'images
        client_max_body_size 50M;
        client_body_timeout 300s;

        # ANDFChat Backend
        location /andfchat/ {
            proxy_pass http://andfchat/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts pour les longues requêtes
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # API Extraction Coordonnées
        location /ia/ {
            proxy_pass http://ia-api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts plus longs pour traitement d'images
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Route par défaut vers ANDFChat
        location / {
            proxy_pass http://andfchat;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health checks
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}